name: CI

on:
  push:
    branches:
      - main
      - 'release/**'
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shell syntax
        run: sh -n install.sh

      - name: PHP syntax
        run: |
          set -e
          find plugin -type f -name '*.php' -print0 |
            while IFS= read -r -d '' file; do
              php -l "$file"
            done

      - name: XML syntax
        run: |
          python3 - <<'PY'
          import pathlib
          import xml.etree.ElementTree as ET
          for path in pathlib.Path("plugin").rglob("*.xml"):
              ET.parse(path)
              print(path)
          PY

      - name: General page JavaScript syntax
        run: |
          python3 - <<'PY'
          import pathlib
          import re

          src = pathlib.Path("plugin/mvc/app/views/OPNsense/AmneziaWG/general.volt").read_text()
          js = src.split("<script>", 1)[1].split("</script>", 1)[0]

          # Replace Volt expressions embedded in JavaScript strings/selectors.
          js = re.sub(r"{{.*?}}", "VOLT", js, flags=re.S)

          # For syntax validation include the diagnostics-only block; remove
          # only the Volt control markers themselves.
          js = re.sub(r"{%\s*if\s+section\s*==\s*'diagnostics'\s*%}", "", js)
          js = re.sub(r"{%\s*endif\s*%}", "", js)

          pathlib.Path("/tmp/general.js").write_text(js)
          PY
          node --check /tmp/general.js

      - name: v2.1.0 health integration
        run: |
          grep -Fq 'PLUGIN_VERSION="2.3.0"' install.sh
          grep -Fq '<version>2.1.0</version>' plugin/mvc/app/models/OPNsense/AmneziaWG/Instance.xml
          grep -Fq '<health_monitor type="BooleanField">' plugin/mvc/app/models/OPNsense/AmneziaWG/Instance.xml
          grep -Fq '<gateway_health_sync type="BooleanField">' plugin/mvc/app/models/OPNsense/AmneziaWG/Instance.xml
          grep -Fq '[health]' plugin/service/conf/actions.d/actions_amneziawg.conf
          grep -Fq '[gateway_sync]' plugin/service/conf/actions.d/actions_amneziawg.conf
          grep -Fq '[gateway_sync_state]' plugin/service/conf/actions.d/actions_amneziawg.conf
          grep -Fq '[gateway_sync_release]' plugin/service/conf/actions.d/actions_amneziawg.conf
          grep -Fq 'amneziawg gateway_sync_release' plugin/mvc/app/controllers/OPNsense/AmneziaWG/Api/InstanceController.php
          grep -Fq "pluginctl -c monitor" plugin/scripts/AmneziaWG/amneziawg-gateway-sync.php
          grep -Fq "watcher_reconciled" plugin/scripts/AmneziaWG/amneziawg-gateway-sync.php
          grep -Fq '<id>instance.health_runtime</id>' plugin/mvc/app/controllers/OPNsense/AmneziaWG/forms/dialogInstance.xml
          grep -Fq "'healthstatus'" plugin/mvc/app/views/OPNsense/AmneziaWG/general.volt
          grep -Fq "Per-client health only" plugin/mvc/app/controllers/OPNsense/AmneziaWG/Api/InstanceController.php
          grep -Fq "health_monitor']" plugin/mvc/app/controllers/OPNsense/AmneziaWG/Api/InstanceController.php
          grep -Fq 'id="badge_health"' plugin/mvc/app/views/OPNsense/AmneziaWG/general.volt
          grep -Fq 'healthSummary' plugin/mvc/app/controllers/OPNsense/AmneziaWG/Api/ServiceController.php
          grep -Fq "Route to health target currently uses" plugin/scripts/AmneziaWG/amneziawg-health.php
          grep -Fq "awg_health_reconcile_gateway_route" plugin/scripts/AmneziaWG/amneziawg-health.php
          grep -Fq "/usr/local/etc/rc.routing_configure alarm" plugin/scripts/AmneziaWG/amneziawg-health.php
          grep -Fq "route_reconciled" plugin/scripts/AmneziaWG/amneziawg-health.php
          grep -Fq "awg_health_probe_route_ensure" plugin/scripts/AmneziaWG/amneziawg-health.php
          grep -Fq "probe_route_owned" plugin/scripts/AmneziaWG/amneziawg-health.php
          grep -Fq "awg_gs_cleanup_probe_route" plugin/scripts/AmneziaWG/amneziawg-gateway-sync.php
          grep -Fq "\$connectivity = 'waiting'" plugin/scripts/AmneziaWG/amneziawg-ifstats.php
          grep -Fq "awg_health_cache_invalidate_iface" plugin/scripts/AmneziaWG/amneziawg-service-control.php
          grep -Fq "@unlink(AWG_STOPPED_FLAG)" plugin/scripts/AmneziaWG/amneziawg-service-control.php
          grep -Fq "stale service-level stopped flag remained" install.sh
          grep -Fq "\$connectivity = 'waiting'" plugin/scripts/AmneziaWG/amneziawg-ifstats.php
          grep -Fq 'amneziawg-health.php' plugin/scripts/AmneziaWG/amneziawg-watchdog.php
          grep -Fq "Tunnel restarted by watchdog; waiting for health recheck" plugin/scripts/AmneziaWG/amneziawg-watchdog.php
          grep -Fq "wdg_mark_restart(\$row['uuid'], \$decoded)" plugin/scripts/AmneziaWG/amneziawg-watchdog.php
          grep -Fq 'Force Down' README.md
          grep -Fq 'public function metricsAction()' plugin/mvc/app/controllers/OPNsense/AmneziaWG/Api/ServiceController.php
          grep -Fq 'text/plain; version=0.0.4' plugin/mvc/app/controllers/OPNsense/AmneziaWG/Api/ServiceController.php
          grep -Fq '<acl_amneziawg_metrics>' plugin/mvc/app/models/OPNsense/AmneziaWG/ACL/ACL.xml
          grep -Fq '<name>AmneziaWG: Prometheus metrics</name>' plugin/mvc/app/models/OPNsense/AmneziaWG/ACL/ACL.xml
          grep -Fq 'opnsense_acl_cache.json' install.sh
          grep -Fq '<pattern>api/amneziawg/service/metrics</pattern>' plugin/mvc/app/models/OPNsense/AmneziaWG/ACL/ACL.xml
          grep -Fq 'scrape never starts a health probe' README.md
